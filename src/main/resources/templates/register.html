<!DOCTYPE html>
<html
  lang="en"
  th:replace="~{base :: parent(~{::#content},~{::title},~{::script})}"
>
  <head>
    <title>Registration Page</title>
  </head>
  <body>
    <div id="content">
      <div class="grid grid-cols-12 gap-4 mt-4">
        <div class="col-span-4 md:col-span-2 ld:col-span-3 xl:col-span-4">
        </div>
        <div class="col-span-12  md:col-span-8 lg:col-span-6 xl:col-span-4">

          <div class="block p-6 border-t-8 border-blue-700 bg-white rounded-lg shadow-sm dark:bg-blue-800 dark:border-blue-700">
              <div href="#">
                  <h5 class="mb-2 text-2xl font-bold tracking-tight text-gray-900 dark:text-white">Signup Here</h5>
              </div>
              <!-- <p class="mb-3 font-normal text-gray-400 dark:text-gray-400">start</p> -->
              <form 
              data-th-action="@{'/do-register'}" 
              method="post" 
              data-th-object="${userForm}"
              class="mt-5">
                <!--name-->
                <div class="mb-3">
                  <label for="name" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Name</label>
                  <input type="text" 
                  id="name" 
                  data-th-field="*{name}"
                  class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Enter Name Here" required />
                </div>
                <!--email-->
                <div class="mb-3">
                  <label for="email" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Email</label>
                  <input type="email"
                   id="email"
                   data-th-field="*{email}"
                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Enter Email Here" required />
                </div>
                <!--password-->
                <div class="mb-3">
                  <label for="password" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Password</label>
                  <input type="password"
                   id="password" 
                   data-th-field="*{password}"
                   
                   class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Enter Password Here" required />
                </div>
               
                <!--phone number-->
                <div class="mb-3">
                  <label for="phone" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Contact Number</label>
                  <input type="tel"
                   id="phone"
                   data-th-field="*{phoneNumber}"
                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Enter Phone Number Here" required />
                </div>
                <!--about-->
                <div class="mb-3">
                  <label for="about" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">About</label>
                  <textarea id="about"
                   rows="4" 
                   data-th-field="*{about}"
                   class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Write about yourself here..."></textarea>
                </div>
                <!--submit button-->
                <div class="mb-3 flex justify-center space-x-3">
                  <button type="submit"
                   class="px-4 py-2 rounded bg-gray-800 hover:bg-gray-600 text-white font-medium dark:bg-blue-800 dark:hover:bg-blue-700">
                    Signup
                  </button>
                  <button type="reset"
                   class="px-4 py-2 rounded bg-orange-800 hover:bg-orange-600 text-white font-medium dark:bg-orange-800 dark:hover:bg-orange-700">
                    Reset
                  </button>
                </div>
                


              </form>
              
          </div>
          
          
        </div>

      </div>
    </div>
    <script>
      console.log("about page");
    </script>
   
  </body>
</html>
